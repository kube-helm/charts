# Default values for rag-api.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: trunglt251292/doraverse-rag-api
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 3081
  targetPort: 3081

# Environment variables for the RAG API
env:
  RAG_PORT: "3081"
  RAG_API_URL: "http://rag-rag-api:3081"
  DB_HOST: "pgvector-vectordb"
  DB_PORT: "5432"
  POSTGRES_DB: "vectordb"
  POSTGRES_USER: "doraverse"
  DEBUG_RAG_API: False
  API_KEY: ""
  POSTGRES_PASSWORD: "doraverse2025"
  EMBEDDINGS_PROVIDER: "openai"
  OPENAI_API_KEY: ""
  EMBEDDINGS_MODEL: "text-embedding-3-small"
  JWT_SECRET: "85aa4ed686f8b2f1523587419cef56aa557fd0a6728f48f3de9ba3132b69bdac"
  JWT_REFRESH_SECRET: "10444b776fd6a27977743288e9a0bb5e26ff6f40d1e24b7a0561b38fbc7c7de5"


# ConfigMap and Secret references
configMapRef: []
secretRef: []

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
